<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#100b19">
<title>Surprise Studio</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  background: #100b19;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  color: #f5cf81;
  font-size: 27px;
}

.subtitle {
  color: #d6c5dc;
}

.panel, #preview {
  max-width: 500px;
  margin: 22px auto;
  padding: 22px;
  background: #21152b;
  border-radius: 18px;
  box-shadow: 0 0 25px #63366d;
}

label {
  display: block;
  text-align: left;
  margin: 15px 0 7px;
  color: #f5cf81;
}

input, select, textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #76517d;
  border-radius: 9px;
  background: #120d19;
  color: white;
  font-size: 16px;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

button {
  width: 100%;
  margin-top: 14px;
  padding: 14px;
  border: none;
  border-radius: 30px;
  background: linear-gradient(90deg,#d99b35,#ffe6a1);
  color: #28132a;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
}

button.secondary {
  background: #563465;
  color: white;
  border: 1px solid #a778b6;
}

button.whatsapp {
  background: #128c4a;
  color: white;
}

#preview {
  display: none;
  min-height: 380px;
  padding: 30px 18px;
  background: linear-gradient(145deg,#54145d,#170b2a);
  overflow-wrap: anywhere;
}

#emoji {
  font-size: 85px;
  margin: 20px 0;
}

#preview h2 {
  color: #ffe1a0;
  font-size: 27px;
}

#preview p {
  font-size: 19px;
  line-height: 1.6;
  white-space: pre-wrap;
}

#ending {
  margin-top: 30px;
}

.confetti {
  position: fixed;
  top: -35px;
  z-index: 10;
  pointer-events: none;
  animation: fall 4s linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(720deg);
    opacity: 0;
  }
}


/* NOUVELLE ENVELOPPE MAGIQUE */
#envelopeScreen {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: radial-gradient(circle, #71365f, #170b22);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px;
}
.envelope-card {
  width: 100%;
  max-width: 430px;
  padding: 28px 20px;
  border-radius: 25px;
  background: linear-gradient(145deg,#ffe3ef,#e99abb);
  color: #54203e;
  box-shadow: 0 0 40px #ff8dc8;
}
.envelope {
  font-size: 115px;
  margin: 20px;
  animation: envelopePulse 1.8s infinite;
}
@keyframes envelopePulse {
  50% { transform: scale(1.10) rotate(3deg); }
}
.envelope-card h2 { color: #78234f; }
.envelope-card button {
  background: linear-gradient(90deg,#b82e77,#f36ba9);
  color: white;
}
.magic-letter {
  background: #fff0f5;
  color: #55243f;
  padding: 20px;
  border-radius: 16px;
  border: 2px solid #ffc1dc;
  animation: letterAppear 1.5s ease both;
}
#customMessage { color: #55243f; }
@keyframes letterAppear {
  from { opacity: 0; transform: translateY(35px) scale(.9); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.firework {
  position: fixed;
  z-index: 50;
  pointer-events: none;
  font-size: 35px;
  animation: fireworkRise 2.5s ease-out forwards;
}
@keyframes fireworkRise {
  0% { transform: translateY(100vh) scale(.3); opacity: 0; }
  40% { opacity: 1; transform: translateY(30vh) scale(1.5); }
  100% { opacity: 0; transform: translateY(0) scale(2); }
}

.hidden {
  display: none !important;
}

.footer {
  color: #a995b4;
  font-size: 12px;
  margin: 30px 0;
}
</style>

<meta property="og:type" content="website">
<meta property="og:title" content="💌 Une surprise pour toi !">
<meta property="og:description" content="Quelqu'un t'a préparé une surprise spéciale. Ouvre ton enveloppe et découvre-la ❤️">
<meta property="og:site_name" content="Surprise Studio">
<meta name="description" content="Découvre une surprise personnalisée préparée spécialement pour toi.">

<meta property="og:image" content="https://issoufoualio124-glitch.github.io/surprise-studio/envelope-preview.png">
</head>

<body>

<h1>✨ SURPRISE STUDIO ✨</h1>
<p class="subtitle">Crée des surprises inoubliables ❤️</p>


<div id="envelopeScreen" class="hidden">
  <div class="envelope-card">
    <div style="font-size:35px">💌</div>
    <h2>Une surprise pour toi !</h2>
    <div class="envelope">💌</div>
    <h2 id="envelopeName">Quelqu'un pense à toi ❤️</h2>
    <p>Une personne spéciale t'a préparé quelque chose de merveilleux...</p>
    <button onclick="openEnvelope()">💌 CLIQUE POUR VOIR LA SURPRISE</button>
    <p style="font-size:13px">Une petite magie t'attend ✨</p>
  </div>
</div>

<div class="panel" id="editor">

  <label>TYPE DE SURPRISE</label>
  <select id="type">
    <option value="birthday">🎂 Birthday Surprise</option>
    <option value="morning">🌅 Morning Surprise</option>
    <option value="evening">🌙 Evening Surprise</option>
  </select>

  <label>PRÉNOM DU DESTINATAIRE</label>
  <input id="name" maxlength="40"
    placeholder="Exemple : Aïcha">

  <label>TITRE PERSONNALISÉ (FACULTATIF)</label>
  <input id="heading" maxlength="80"
    placeholder="Exemple : Une journée magique">

  <label>TON MESSAGE PERSONNALISÉ</label>
  <textarea id="message" maxlength="700"
    placeholder="Écris ton propre message ici..."></textarea>

  <label>COULEUR DE LA SURPRISE</label>
  <select id="theme">
    <option value="purple">Violet magique</option>
    <option value="pink">Rose romantique</option>
    <option value="blue">Bleu élégant</option>
    <option value="gold">Or luxueux</option>
    <option value="black">Noir mystérieux</option>
  </select>

  <button onclick="createSurprise()">
    ✨ CRÉER MA SURPRISE
  </button>

</div>

<div id="preview">
  <div id="emoji">🎂</div>
  <h2 id="title"></h2>
  <h2 id="greeting"></h2>
  <div class="magic-letter"><p id="customMessage"></p></div>
  <h2 id="ending">❤️✨❤️</h2>
  <button class="secondary" onclick="specialEffects()">🎆 RELANCER LES EFFETS MAGIQUES</button>
</div>

<div class="panel hidden" id="actions">

  <button class="secondary" onclick="shareSurprise()">
    🔗 PARTAGER MA SURPRISE
  </button>

  <button class="whatsapp" onclick="shareWhatsApp()">
    💚 ENVOYER SUR WHATSAPP
  </button>

  <button class="secondary" onclick="downloadVideo()">
    🎬 TÉLÉCHARGER EN VIDÉO
  </button>

  <button class="secondary" onclick="resetApp()">
    ↩️ CRÉER UNE AUTRE SURPRISE
  </button>

</div>

<script>
const surpriseFirebaseConfig = {
  apiKey: "AIzaSyDGnT_g91YpkpYEj-xbB87Q9iGG6EXGyoQ",
  authDomain: "surprise-studio-58f5f.firebaseapp.com",
  projectId: "surprise-studio-58f5f",
  storageBucket: "surprise-studio-58f5f.firebasestorage.app",
  messagingSenderId: "730844491863",
  appId: "1:730844491863:web:42a0477ba9018dd1cc7312"
};

firebase.initializeApp(surpriseFirebaseConfig);

const surpriseFirebaseAuth = firebase.auth();
const surpriseFirebaseDB = firebase.firestore();

const surpriseFirebaseReady = new Promise((resolve, reject) => {
  const unsubscribe = surpriseFirebaseAuth.onAuthStateChanged(user => {
    unsubscribe();

    if (user) {
      resolve(user);
    } else {
      surpriseFirebaseAuth.signInAnonymously()
        .then(result => resolve(result.user))
        .catch(reject);
    }
  }, reject);
});
</script>

<script>
"use strict";

const $ = id => document.getElementById(id);

const themes = {
  purple: ["#54145d", "#170b2a"],
  pink: ["#a82c68", "#38132f"],
  blue: ["#145477", "#101c38"],
  gold: ["#80601c", "#21172c"],
  black: ["#34313c", "#080808"]
};

const categories = {
  birthday: ["🎁", "Joyeux anniversaire"],
  morning: ["☀️", "Bonjour"],
  evening: ["🌹", "Bonsoir"]
};

let currentData = null;

function getSurpriseData() {
  return {
    type: $("type").value,
    name: $("name").value.trim(),
    heading: $("heading").value.trim(),
    message: $("message").value.trim(),
    theme: $("theme").value
  };
}

function createSurprise(data = null) {
  const info = data || getSurpriseData();

  if (!info.name) {
    alert("Entre d'abord le prénom du destinataire !");
    return;
  }

  if (!categories[info.type] || !themes[info.theme]) {
    alert("Les paramètres de cette surprise sont invalides.");
    return;
  }

  currentData = info;

  $("title").textContent =
    info.heading || categories[info.type][1];

  $("emoji").textContent = categories[info.type][0];

  $("greeting").textContent =
    categories[info.type][1] + " " + info.name + " !";

  $("customMessage").textContent =
    info.message || "Tu mérites tout le bonheur du monde ❤️";

  $("preview").style.background =
    `linear-gradient(145deg, ${themes[info.theme][0]}, ${themes[info.theme][1]})`;

  $("preview").style.display = "block";
  $("actions").classList.remove("hidden");

  // Interface différente pour le destinataire
  const isRecipient = location.hash.startsWith("#s=") || new URLSearchParams(location.search).has("s");
  const buttons = $("actions").querySelectorAll("button");

  buttons[0].style.display = isRecipient ? "none" : "";
  buttons[1].style.display = isRecipient ? "none" : "";
  buttons[2].style.display = "";
  buttons[3].style.display = isRecipient ? "none" : "";

  $("preview").scrollIntoView({
    behavior: "smooth",
    block: "center"
  });

  confetti();
}

function confetti() {
  const symbols = ["✨", "❤️", "🎉", "🌹", "💖", "⭐"];

  for (let i = 0; i < 65; i++) {
    const item = document.createElement("div");

    item.className = "confetti";
    item.textContent =
      symbols[Math.floor(Math.random() * symbols.length)];

    item.style.left = Math.random() * 100 + "vw";
    item.style.animationDelay = Math.random() * 2 + "s";
    item.style.fontSize =
      (15 + Math.random() * 20) + "px";

    document.body.appendChild(item);

    setTimeout(() => item.remove(), 6500);
  }
}

// Création d'un lien court avec Firebase
async function makeShareLink() {
  const data = currentData || getSurpriseData();

  if (!data.name) {
    alert("Entre le prénom du destinataire !");
    return null;
  }

  if (!categories[data.type] || !themes[data.theme]) {
    alert("Les paramètres de cette surprise sont invalides.");
    return null;
  }

  try {
    const user = await surpriseFirebaseReady;

    const docRef = await surpriseFirebaseDB
      .collection("surprises")
      .add({
        name: data.name,
        type: data.type,
        heading: data.heading || "",
        message: data.message || "",
        theme: data.theme,
        ownerUid: user.uid,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

    return location.origin + location.pathname + "?s=" + docRef.id;

  } catch (error) {
    console.error("Erreur Firebase :", error);
    alert("Impossible d'enregistrer la surprise. Vérifie ta connexion et les règles Firestore.");
    return null;
  }
}

// Partage classique
async function shareSurprise() {
  const link = await makeShareLink();

  if (!link) return;

  try {
    if (navigator.share) {
      await navigator.share({
        title: "Une surprise pour toi ❤️",
        text: "J'ai préparé une surprise spéciale pour toi !",
        url: link
      });
    } else {
      await copyLink(link);
    }
  } catch (error) {
    if (error.name !== "AbortError") {
      prompt("Copie ton lien ici :", link);
    }
  }
}

async function copyLink(link) {
  try {
    await navigator.clipboard.writeText(link);
    alert("Lien copié ! Tu peux l'envoyer à tes amis.");
  } catch (error) {
    prompt("Copie ton lien de surprise :", link);
  }
}

// Partage WhatsApp
async function shareWhatsApp() {
  const link = await makeShareLink();

  if (!link) return;

  const text = encodeURIComponent(
    "💌 Une surprise spéciale t’attend ! ❤️\nOuvre ton enveloppe ici : " + link
  );

  window.open(
    "https://wa.me/?text=" + text,
    "_blank"
  );
}

// Lecture d'une surprise reçue
async function loadSharedSurprise() {
  const params = new URLSearchParams(location.search);
  const shortId = params.get("s");

  try {
    let data;

    if (shortId) {
      await surpriseFirebaseReady;

      const doc = await surpriseFirebaseDB
        .collection("surprises")
        .doc(shortId)
        .get();

      if (!doc.exists) {
        throw new Error("Surprise introuvable");
      }

      data = doc.data();

    } else if (location.hash.startsWith("#s=")) {
      const encoded = location.hash.substring(3);
      data = JSON.parse(decodeURIComponent(encoded));

    } else {
      return;
    }

    if (!data.name ||
        !categories[data.type] ||
        !themes[data.theme]) {
      throw new Error("Données invalides");
    }

    currentData = {
      type: data.type,
      name: data.name,
      heading: data.heading || "",
      message: data.message || "",
      theme: data.theme
    };

    $("editor").classList.add("hidden");
    $("preview").style.display = "none";
    $("actions").classList.add("hidden");
    $("envelopeName").textContent = data.name + " ❤️";
    $("envelopeScreen").classList.remove("hidden");

  } catch (error) {
    console.error("Erreur de chargement :", error);
    alert("Cette surprise est introuvable ou le lien est invalide. Vérifie ta connexion Internet.");
  }
}

function openEnvelope() {
  if (!currentData) return;

  $("envelopeScreen").classList.add("hidden");
  createSurprise(currentData);

  setTimeout(specialEffects, 500);
}

function specialEffects() {
  const symbols = ["❤️", "💖", "💕", "✨", "🎆", "🌹", "⭐"];

  for (let i = 0; i < 45; i++) {
    const item = document.createElement("div");
    item.className = "firework";
    item.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    item.style.left = Math.random() * 95 + "vw";
    item.style.animationDelay = Math.random() * 1.5 + "s";
    document.body.appendChild(item);
    setTimeout(() => item.remove(), 4500);
  }

  confetti();
}

// Exportation vidéo WebM
async function downloadVideo() {
  const data = currentData || getSurpriseData();

  if (!data.name) {
    alert("Entre d'abord le prénom du destinataire !");
    return;
  }

  if (!window.MediaRecorder ||
      !HTMLCanvasElement.prototype.captureStream) {
    alert("L'exportation vidéo n'est pas disponible sur ce navigateur.");
    return;
  }

  const canvas = document.createElement("canvas");
  canvas.width = 720;
  canvas.height = 1280;

  const ctx = canvas.getContext("2d");

  const stream = canvas.captureStream(30);

  const mime = [
    "video/webm;codecs=vp9",
    "video/webm;codecs=vp8",
    "video/webm"
  ].find(type => MediaRecorder.isTypeSupported(type));

  if (!mime) {
    alert("Format vidéo non disponible.");
    stream.getTracks().forEach(track => track.stop());
    return;
  }

  const chunks = [];

  const recorder = new MediaRecorder(stream, {
    mimeType: mime
  });

  recorder.ondataavailable = event => {
    if (event.data.size > 0) {
      chunks.push(event.data);
    }
  };

  recorder.onerror = () => {
    stream.getTracks().forEach(track => track.stop());
    alert("Une erreur est survenue pendant l'exportation.");
  };

  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: mime });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "surprise-" +
      data.name.replace(/[^a-z0-9_-]/gi, "_") + ".webm";

    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(() => URL.revokeObjectURL(url), 60000);

    stream.getTracks().forEach(track => track.stop());

    alert("Ta vidéo est prête ! 🎉");
  };

  const colors = themes[data.theme];
  const category = categories[data.type];

  const title = data.heading || category[1];
  const greeting = category[1] + " " + data.name + " !";
  const message = data.message ||
    "Tu mérites tout le bonheur du monde ❤️";

  const particles = Array.from({length: 30}, () => ({
    x: Math.random() * 720,
    y: Math.random() * 1280,
    size: 2 + Math.random() * 7
  }));

  function drawText(text, x, y, maxWidth, lineHeight) {
    const words = text.split(/\s+/);
    let line = "";

    for (const word of words) {
      const test = line ? line + " " + word : word;

      if (ctx.measureText(test).width > maxWidth && line) {
        ctx.fillText(line, x, y);
        line = word;
        y += lineHeight;
      } else {
        line = test;
      }
    }

    if (line) ctx.fillText(line, x, y);
  }

  let frame = 0;

  function draw() {
    const gradient = ctx.createLinearGradient(0, 0, 720, 1280);

    gradient.addColorStop(0, colors[0]);
    gradient.addColorStop(1, colors[1]);

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 720, 1280);

    // Particules lumineuses
    ctx.fillStyle = "#ffe6a1";

    for (const p of particles) {
      const y = (p.y + frame * 1.2) % 1280;

      ctx.globalAlpha = 0.25 + Math.random() * 0.55;
      ctx.beginPath();
      ctx.arc(p.x, y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalAlpha = 1;
    ctx.textAlign = "center";

    ctx.fillStyle = "#ffe4a6";
    ctx.font = "bold 45px Arial";
    ctx.fillText("SURPRISE STUDIO", 360, 145);

    ctx.font = "115px Arial";
    ctx.fillText(category[0], 360, 350);

    ctx.fillStyle = "white";
    ctx.font = "bold 45px Arial";
    drawText(title, 360, 510, 620, 60);

    ctx.fillStyle = "#ffe4a6";
    ctx.font = "bold 37px Arial";
    drawText(greeting, 360, 650, 620, 55);

    ctx.fillStyle = "white";
    ctx.font = "31px Arial";
    drawText(message, 360, 790, 620, 50);

    ctx.fillStyle = "#ffe4a6";
    ctx.font = "55px Arial";
    ctx.fillText("❤️ ✨ ❤️", 360, 1120);

    frame++;

    if (frame < 240) {
      requestAnimationFrame(draw);
    } else {
      recorder.stop();
    }
  }

  recorder.start();
  draw();
}

// Nouvelle surprise
function resetApp() {
  currentData = null;

  $("type").value = "birthday";
  $("name").value = "";
  $("heading").value = "";
  $("message").value = "";
  $("theme").value = "purple";

  $("preview").style.display = "none";
  $("actions").classList.add("hidden");
  $("editor").classList.remove("hidden");

  history.replaceState(
    null,
    "",
    location.pathname + location.search
  );

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

window.addEventListener("load", loadSharedSurprise);
</script>
